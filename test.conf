server {
    listen 8080;
    server_name localhost;

    root ./YoupiBanane;
    index index.html;

    ########################################
    # / → APENAS GET
    ########################################
    location / {
        allow_methods GET;
    }

    ########################################
    # CGI para .bla → POST apenas
    ########################################
    location /YoupiBanane {
        allow_methods POST;
		has_cgi true;
        cgi_ext .bla;
        cgi_path /YoupiBanane/cgi_tester;
    }

    ########################################
    # /post_body → POST com maxBody = 100
    ########################################
    location /post_body {
        allow_methods POST;
        max_body_size 100;
    }
    location /nop {
        allow_methods GET;
        auto_index on;
    }

    ########################################
    # /directory/ → GET
    # root = YoupiBanane
    # index = youpi.bad_extension
    ########################################
    location /directory {
        allow_methods GET POST;
        root ./YoupiBanane;
        index youpi.bad_extension;
        auto_index off;
    }
	location /test {
	}
}
