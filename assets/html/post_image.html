<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Image (POST)</title>
</head>

<body bgcolor="#f0f9ff">

<!-- HEADER -->
<table width="100%" bgcolor="#075985" cellpadding="25">
    <tr>
        <td align="center">
            <font color="white" size="7">
                <b>POST Image Upload</b>
            </font>
        </td>
    </tr>
</table>

<br><br>

<!-- FORM CONTAINER -->
<table width="60%" align="center" cellpadding="25" bgcolor="#ffffff" border="1">
    <tr>
        <td align="center">

            <form method="POST"
                  action="/upload"
                  enctype="multipart/form-data">

                <p>
                    <b>Select an image to upload</b><br><br>
                    <input type="file" name="image">
                </p>

                <br>

                <input type="submit" value="Upload Image">

            </form>

        </td>
    </tr>
</table>

<br><br>

<!-- BACK -->
<table width="60%" align="center">
    <tr>
        <td align="center">
            <a href="/index.html">
                <input type="button" value="Return to Home Page">
            </a>
        </td>
    </tr>
</table>

</body>
</html>
