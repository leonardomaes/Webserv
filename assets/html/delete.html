<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DELETE Method</title>
</head>
<body bgcolor="#fee2e2">

<table width="100%" bgcolor="#991b1b" cellpadding="25">
    <tr>
        <td align="center">
            <font color="white" size="7"><b>DELETE Method</b></font>
        </td>
    </tr>
</table>

<br>

<table width="60%" align="center" cellpadding="20" bgcolor="#ffffff">
    <tr>
        <td align="center">
            <form method="POST" action="/delete">
                <!-- Method Override for Option 2 -->
                <input type="hidden" name="_method" value="DELETE">

                <p>
                    <label>Filename to delete (in /delete/ folder):</label><br>
                    <input type="text" name="id" placeholder="testfile.txt">
                </p>

                <input type="submit" value="Send DELETE Request">
            </form>
        </td>
    </tr>
</table>

<br>

<!-- Return Button (Matches your other pages) -->
<table width="60%" align="center">
    <tr>
        <td align="center">
            <a href="/index.html">
                <input type="button" value="Return to Home Page">
            </a>
        </td>
    </tr>
</table>

</body>
</html>
