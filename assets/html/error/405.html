<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>405 — Method Not Allowed</title>
</head>
<body bgcolor="#f8d7da">

    <table width="100%" bgcolor="#721c24" cellpadding="25">
        <tr>
            <td align="center">
                <font color="white" size="7"><b>405 — Method Not Allowed</b></font>
            </td>
        </tr>
    </table>

    <table width="80%" align="center" cellpadding="20">
        <tr>
            <td align="center">
                <font size="5">The HTTP method used is not allowed for this resource.</font><br><br>
                <font size="5">Check whether you should be using GET, POST, DELETE.</font><br><br>
                <font size="4">Please check the URL or return to the homepage.</font>
            </td>
        </tr>
    </table>

</body>
</html>
