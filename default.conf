server {
    listen 8080;
    server_name one;
    root assets;
    index index.html;
    client_max_body_size 2097152; # 2Mb

    error_page 400 401 403 404 405 error/40x.html;

	location /images {
		allow_methods GET;
		auto_index on;
        index index.html;
	}

    location /images/private {
		allow_methods GET;
		auto_index off;
        index index.html;
	}

    location /upload {
        allow_methods GET POST DELETE;
        root assets;
        redirect html/upload;
        auto_index on;
    }

    location /cgi-py { 
        allow_methods GET POST;
        has_cgi true;
        cgi_path /usr/bin/python3;
        cgi_ext .py;
    }

    location /cgi-php {
        allow_methods GET POST;
        has_cgi true;
        cgi_path /usr/bin/php-cgi;  
        cgi_ext .php;
    }

	location /error {
	}
}

