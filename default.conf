server {
    listen 8080;
    server_name one;
    root assets/html;
    index index.html;
    client_max_body_size 2097152; # 2Mb

    error_page 400 401 403 404 405 error/40x.html;

	location /images {
		allow_methods GET;
		auto_index on;
        index index.html;
	}

    location /images/private {
		allow_methods GET;
		auto_index off;
        index index.html;
	}

    location /upload {
        allow_methods GET POST DELETE;
        root assets/html;
        upload_to assets/uploads;
        auto_index on;
    }

    location /cgi-py { 
        allow_methods GET POST;
        has_cgi true;
        cgi_path /usr/bin/python3;
        cgi_ext .py;
    }

    location /cgi-php {
        allow_methods GET POST;
        has_cgi true;
        cgi_path /usr/bin/php-cgi;  
        cgi_ext .php;
    }

	location /error {
	}
}

server {
    listen 8081;
    server_name one;
    root assets/html;
    index index.html;
    allow_methods GET POST DELETE;
    client_max_body_size 2097152; # 2Mb

    error_page 400 401 403 404 405 error/40x.html;

	location /images {
		allow_methods GET;
		auto_index on;
        index index.html;
	}

    location /images/private {
		allow_methods GET;
		auto_index off;
        index index.html;
	}

    location /upload {
        allow_methods GET POST;
        upload_to assets/uploads;
        cgi_path cgi-bin/;
        cgi_ext .py;
    }

    location /delete {
        allow_methods POST DELETE;
        root assets/html;
        auto_index off;
    }

    location /cgi_get { 
        cgi_path cgi-bin/;
        cgi_ext .py;
    }

	location /error{
	}
}
