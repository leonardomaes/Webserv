server {
    listen 8080;
    server_name one;
    root assets/;
    index index.html;
    allow_methods GET POST DELETE;
    client_max_body_size 2097152; # 2Mb

    error_page 400 401 402 403 404 405 /40x.html;

	location /images {
		allow_methods GET;
		autoindex on;
        index index.html;
	}

    location /images/private {
		allow_methods GET;
		autoindex off;
        index index.html;
	}

    location /upload {
        allow_methods GET POST;
        upload_to assets/uploads;
        cgi_path cgi-bin/;
        cgi_ext .py;
    }

    location /delete {
        root assets/delete;
        allow_methods DELETE;
    }

    location /cgi_get { 
        cgi_path cgi-bin/;
        cgi_ext .py;
    }
}
